<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Max</title>
		<!--
  Max's home rails, cut down to the card markup streamBuddy reads: a[class*="StyledTileLinkNormal-"] links whose
  aria-label wraps the title in bidi isolates, holding a positioned [data-testid$="_tileImage"] box. The artwork
  sits inset in that box, and the box also holds a rounded focus outline drawn 4px outside the artwork, which the
  badge must not mistake for the artwork. data-sb-art marks the artwork (the test's own marker).
-->
		<style>
			body {
				margin: 0;
				background: #0b0c10;
				color: #fff;
				font:
					14px/1.3 Arial,
					"Liberation Sans",
					sans-serif;
			}
			section {
				padding: 0 40px;
				margin: 0 0 28px;
			}
			h2 {
				font-size: 18px;
				margin: 0 0 10px;
			}
			.rail {
				display: flex;
				gap: 8px;
			}
			.tile {
				display: block;
				color: inherit;
				text-decoration: none;
				flex: 0 0 calc((100% - 40px) / 6);
			}
			.landscape .tile {
				flex-basis: calc((100% - 16px) / 3);
			}
			.StyledTileImage {
				position: relative;
				padding: 4px;
			}
			.outline {
				position: absolute;
				inset: 0;
				border-radius: 12px;
				border: 2px solid transparent;
			}
			.poster {
				border-radius: 8px;
				overflow: hidden;
			}
			.poster img {
				display: block;
				width: 100%;
				aspect-ratio: 2 / 3;
				object-fit: cover;
			}
			.landscape .poster img {
				aspect-ratio: 16 / 9;
			}
			.md_strong-x {
				margin: 6px 4px 0;
				font-size: 13px;
			}
		</style>
	</head>
	<body>
		<section data-shot="posters">
			<h2>Posters</h2>
			<div class="rail">
				<a
					class="StyledTileLinkNormal-Beam-Web-Ent__sc-1ramr47-31 tile"
					href="/show/tlou"
					aria-label="⁦The Last of Us⁩, Rated TV-MA"
				>
					<div
						class="StyledTileImage"
						data-testid="tlou_tileImage"
					>
						<div class="outline"></div>
						<div
							class="poster"
							data-sb-art
							data-sb-corner="bottom"
						>
							<img
								alt=""
								src="https://art.test/art/tlou.svg?w=400&amp;h=600&amp;hue=160"
							/>
						</div>
					</div>
					<p class="md_strong-x">The Last of Us</p>
				</a>
				<a
					class="StyledTileLinkNormal-Beam-Web-Ent__sc-1ramr47-31 tile"

	</body>
</html>
