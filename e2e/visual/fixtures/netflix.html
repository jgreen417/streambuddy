<!doctype html>

		<meta charset="utf-8" />
		<title>Home - Netflix</title>
		<!--
  Netflix's browse page, cut down to the card markup streamBuddy reads: rows of a[data-uia=…-card] links inside
  padded div[data-virtual-slot] slots, with the boxart in a rounded, clipped box. data-sb-art marks the artwork
  each badge is measured against (the test's own marker, not Netflix's). Artwork comes from /art/ (see art.ts).
-->
		<style>
			body {
				margin: 0;
				background: #141414;
				color: #e5e5e5;
				font:
					14px/1.25 Arial,
					"Liberation Sans",
					sans-serif;
			}
			.lolomoRow {
				margin: 0 0 28px;
				padding: 0 4%;
			}
			.rowHeader {
				margin: 0 0 8px;
				font-size: 18px;
				font-weight: 700;
			}
			.sliderContent {
				display: flex;
			}
			[data-virtual-slot] {
				box-sizing: border-box;
				padding: 0 0.2vw;
				flex: 0 0 calc(100% / 6);
			}
			.row-8 [data-virtual-slot] {
				flex-basis: calc(100% / 8);
			}
			.row-ranked [data-virtual-slot] {
				flex-basis: calc(100% / 5);
			}
			a {
				color: inherit;
				text-decoration: none;
				display: block;
			}
			.boxart-container {
				position: relative;
				padding-top: 56.25%;
				border-radius: 4px;
				overflow: hidden;
			}
			.boxart-container img {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				object-fit: cover;
			}
			.progress {
				height: 3px;
				margin-top: 6px;
				background: #4d4d4d;
			}
			.progress i {
				display: block;
				height: 100%;
				background: #e50914;
			}
			.ranked {
				display: flex;
				align-items: stretch;
				height: 0;
				padding-top: 70%;
				position: relative;
			}
			.ranked svg {
				position: absolute;
				left: 0;
				top: 0;
				height: 100%;
				width: 50%;
			}
			.ranked .poster {
				position: absolute;
				right: 0;
				top: 0;
				width: 50%;
				height: 100%;
				border-radius: 4px;
				overflow: hidden;
			}
			.ranked .poster img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				display: block;
			}
			.episode-name {
				margin-top: 6px;
				font-size: 13px;
				color: #bcbcbc;
			}
		</style>
