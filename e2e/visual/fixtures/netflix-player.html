<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Netflix</title>
		<!--
  Netflix's player in its last minute: a <video> (a silent 22-minute file served by the test) seeked to 60 seconds
  before the end, and the title where Netflix shows it ([data-uia="video-title"] h4). streamBuddy's end-of-film
  rating prompt reads both.
-->
		<style>
			body {
				margin: 0;
				background: #000;
				color: #fff;
				font:
					14px/1.3 Arial,
					"Liberation Sans",
					sans-serif;
				height: 100vh;
				overflow: hidden;
			}
			video {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				background: radial-gradient(circle at 40% 40%, #2b2b2b, #000 70%);
			}
			.credits {
				position: absolute;
				left: 0;
				right: 0;
				top: 18%;
				text-align: center;
				color: #ddd;
				font:
					17px/2.1 Georgia,
					"DejaVu Serif",
					serif;
				letter-spacing: 1px;
			}
			.controls {
				position: absolute;
				left: 0;
				right: 0;
				bottom: 0;
				height: 110px;
				background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
			}
			.progress {
				position: absolute;
				left: 40px;
				right: 40px;
				bottom: 64px;
				height: 4px;
				background: #555;
				border-radius: 2px;
			}
			.progress i {
				display: block;
				width: 97%;
				height: 100%;
				background: #e50914;
				border-radius: 2px;
			}
			[data-uia="control-nav-back"] {
				position: absolute;
				left: 44px;
				top: 28px;
				width: 32px;
				height: 32px;
				border: 0;
				background: none;
				color: #fff;
			}
			[data-uia="video-title"] {
				position: absolute;
				left: 50%;
				bottom: 18px;
				transform: translateX(-50%);
			}
			[data-uia="video-title"] h4 {
				margin: 0;
				font-size: 16px;
				font-weight: 700;
			}
		</style>
	</head>
	<body>
		<video
			src="/media/feature.wav"
			preload="auto"
			muted
		></video>
		<div class="credits">
			DIRECTED BY
			<br />
			Celine Song
			<br />
			<br />
			EDITOR
			<br />
			Keith Fraase
		</div>
		<button data-uia="control-nav-back" aria-label="Back to browse">&larr;</button>
		<div class="controls">
			<div class="progress"><i></i></div>
			<div data-uia="video-title"><h4>Past Lives</h4></div>
		</div>
		<script>
			const video = document.querySelector("video")
			video.addEventListener("loadedmetadata", () => {
				video.currentTime = video.duration - 60
			})
			video.addEventListener("seeked", () => (document.body.dataset.seeked = "true"))
		</script>
	</body>
</html>
