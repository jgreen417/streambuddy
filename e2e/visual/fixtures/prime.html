<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prime Video: Home</title>
<!--
  Prime Video's storefront, cut down to the card markup streamBuddy reads:
  - carousel cards: li > article[data-card-title] > section > div (the badge's box) > rounded artwork
  - large cards: article[data-testid="…-card"] holding the artwork (super carousel, Top 10) or the hero's
    div[data-testid="title-metadata-main"] block
  Prime composites its "prime" or a channel logo into the artwork's bottom-right corner and says where in the image
  URL (_CLs|W,H|…channels-logo…|…+x,y,w,h); art.ts draws the logo there, so the badge has to clear it.
  The super-carousel cards also hold a hidden landscape image with its logo in another place.
  Each card's detail link comes before its artwork: streamBuddy takes the card's first link as the title link.
  data-sb-art marks the artwork each badge is measured against (the test's own marker).
-->
<style>
	body {
		margin: 0;
		background: #00050d;
		color: #fff;
		font:
			14px/1.3 Arial,
			"Liberation Sans",
			sans-serif;
	}
	section.row {
		padding: 0 48px;
		margin: 0 0 28px;
	}
	h2 {
		font-size: 18px;
		margin: 0 0 10px;
	}
	ul {
		list-style: none;
		margin: 0;
		padding: 0;
		display: flex;
		gap: 12px;
	}
	ul > li {
		flex: 0 0 calc((100% - 60px) / 6);
	}
	.wide ul > li {
		flex-basis: calc((100% - 24px) / 3);
	}
	.card {
		position: relative;
	}
	.art {
		position: relative;
	}
	.pic {
		border-radius: 8px;
		overflow: hidden;
	}
	.pic img {
		display: block;
		width: 100%;
		aspect-ratio: 16 / 9;
		object-fit: cover;
	}
	.cardlink {
		position: absolute;
		inset: 0;
		z-index: 1;
	}
	.supers {
		display: flex;
		gap: 16px;
	}
	.super {
		position: relative;
		flex: 0 0 220px;
	}
	.super .pic img {
		aspect-ratio: 2 / 3;
	}
	.super .landscape {
		display: none;
	}
	.topten {
		position: relative;
		flex: 0 0 300px;
		display: flex;
		align-items: flex-end;
		height: 300px;
	}
	.topten .num {
		font:
			900 200px/0.8 Arial,
			sans-serif;
		color: transparent;
		-webkit-text-stroke: 3px #8197a4;
		width: 110px;
	}
	.topten .pic {
		flex: 1;
	}
	.topten .pic img {
		aspect-ratio: 2 / 3;
	}
	.hero {
		position: relative;
		height: 380px;
		background:
			linear-gradient(90deg, #00050d 30%, transparent),
			url("https://art.test/art/hero.svg?w=1440&h=380&hue=200") center / cover;
	}
	.hero [data-testid="title-metadata-main"] {
		position: absolute;
		left: 48px;
		bottom: 40px;
		width: 420px;
		padding: 16px;
	}
	.hero .title-logo {
		display: block;
		width: 300px;
		height: 110px;
	}
	.hero p {
		margin: 12px 0 0;
		color: #aab;
	}
		
</style>
</head>
<body>
	<!-- each card on one line with no whitespace inside it, as Prime serves it: streamBuddy walks firstChild -->
	<section class="row hero-row" data-shot="hero">
		<article data-testid="hero-card" class="hero"><a class="cardlink" href="/detail/citadel/" aria-label="Citadel"></a><div data-testid="title-metadata-main"><img class="title-logo" alt="Citadel" src="https://art.test/art/citadel-logo.svg?w=300&amp;h=110&amp;hue=40"><p>Season 2 · Spy thriller</p></div></article>
	</section>
	<section class="row" data-shot="carousel">
		<h2>Included with Prime: carousel cards</h2>
		<ul>
			<li><article data-card-title="The Boys" data-card-entity-type="TV Show"><section class="card"><div class="art"><a class="cardlink" href="/detail/The/" aria-label="The Boys"></a><div class="pic" data-sb-art data-sb-corner="bottom"><img alt="" src="https://art.test/art/boys._CLs|720,405|channels-logo|0,0,720,405+624,349,80,40_.svg?w=720&amp;h=405&amp;hue=0"></div></div></section></article></li>
			<li><article data-card-title="Fallout" data-card-entity-type="TV Show"><section class="card"><div class="art"><a class="cardlink" href="/detail/Fallout/" aria-label="Fallout"></a><div class="pic" data-sb-art data-sb-corner="bottom"><img alt="" src="https://art.test/art/fallout._CLs|720,405|channels-logo|0,0,720,405+624,349,80,40_.svg?w=720&amp;h=405&amp;hue=40"></div></div></section></article></li>
			<li><article data-card-title="Saltburn" data-card-entity-type="Movie"><section class="card"><div class="art"><a class="cardlink" href="/detail/Saltburn/" aria-label="Saltburn"></a><div class="pic" data-sb-art data-sb-corner="bottom"><img alt="" src="https://art.test/art/saltburn._CLs|720,405|channels-logo|0,0,720,405+624,349,80,40_.svg?w=720&amp;h=405&amp;hue=140"></div></div></section></article></li>
			<li><article data-card-title="Road House" data-card-entity-type="Movie"><section class="card"><div class="art"><a class="cardlink" href="/detail/Road/" aria-label="Road House"></a><div class="pic" data-sb-art data-sb-corner="bottom"><img alt="" src="https://art.test/art/roadhouse._CLs|720,405|channels-logo|0,0,720,405+624,349,80,40_.svg?w=720&amp;h=405&amp;hue=20"></div></div></section></article></li>
			<li><article data-card-title="Air" data-card-entity-type="Movie"><section class="card"><div class="art"><a class="cardlink" href="/detail/Air/" aria-label="Air"></a><div class="pic" data-sb-art data-sb-corner="bottom"><img alt="" src="https://art.test/art/air.svg?w=720&amp;h=405&amp;hue=200"></div></div></section></article></li>
			<li><article data-card-title="Reacher [4K UHD]" data-card-entity-type="TV Show"><section class="card"><div class="art"><a class="cardlink" href="/detail/Reacher/" aria-label="Reacher [4K UHD]"></a><div class="pic" data-sb-art data-sb-corner="bottom"><img alt="" src="https://art.test/art/reacher.svg?w=720&amp;h=405&amp;hue=220"></div></div></section></article></li>
		</ul>
	</section>
	<section class="row wide" data-shot="carousel-wide">
		<h2>Large carousel cards and channel logos</h2>
		<ul>
			<li><article data-card-title="Yellowstone - Season 1" data-card-entity-type="TV Show"><section class="card"><div class="art"><a class="cardlink" href="/detail/Yellowstone/" aria-label="Yellowstone - Season 1"></a><div class="pic" data-sb-art data-sb-corner="bottom"><img alt="" src="https://art.test/art/yellowstone._CLs|720,405|channels-logo-paramount|0,0,720,405+560,345,140,44_.svg?w=720&amp;h=405&amp;hue=30"></div></div></section></article></li>
			<li><article data-card-title="The Idea of You" data-card-entity-type="Movie"><section class="card"><div class="art"><a class="cardlink" href="/detail/The/" aria-label="The Idea of You"></a><div class="pic" data-sb-art data-sb-corner="bottom"><img alt="" src="https://art.test/art/ideaofyou._CLs|720,405|channels-logo|0,0,720,405+624,349,80,40_.svg?w=720&amp;h=405&amp;hue=330"></div></div></section></article></li>
			<li><article data-card-title="Red One" data-card-entity-type="Movie"><section class="card"><div class="art"><a class="cardlink" href="/detail/Red/" aria-label="Red One"></a><div class="pic" data-sb-art data-sb-corner="bottom"><img alt="" src="https://art.test/art/redone.svg?w=720&amp;h=405&amp;hue=0"></div></div></section></article></li>
		</ul>
	</section>
	<section class="row" data-shot="super">
		<h2>Super carousel and Top 10</h2>
		<div class="supers">
			<article data-testid="super-carousel-card" class="super"><a class="cardlink" href="/detail/invincible/" aria-label="Invincible"></a><div class="pic" data-sb-art data-sb-corner="bottom"><picture><img alt="" class="landscape" src="https://art.test/art/invincible-l._CLs|1280,720|channels-logo|0,0,1280,720+40,40,120,60_.svg?w=1280&amp;h=720&amp;hue=260"><img alt="" src="https://art.test/art/invincible-p._CLs|600,900|channels-logo|0,0,600,900+500,836,80,40_.svg?w=600&amp;h=900&amp;hue=260"></picture></div></article>
			<article data-testid="super-carousel-card" class="super"><a class="cardlink" href="/detail/holdovers/" aria-label="The Holdovers"></a><div class="pic" data-sb-art data-sb-corner="bottom"><picture><img alt="" class="landscape" src="https://art.test/art/holdovers-l._CLs|1280,720|channels-logo|0,0,1280,720+40,40,120,60_.svg?w=1280&amp;h=720&amp;hue=30"><img alt="" src="https://art.test/art/holdovers-p._CLs|600,900|channels-logo|0,0,600,900+500,836,80,40_.svg?w=600&amp;h=900&amp;hue=30"></picture></div></article>
			<article data-testid="super-carousel-card" class="super"><a class="cardlink" href="/detail/fall/" aria-label="Anatomy of a Fall"></a><div class="pic" data-sb-art data-sb-corner="bottom"><picture><img alt="" class="landscape" src="https://art.test/art/fall-l._CLs|1280,720|channels-logo|0,0,1280,720+40,40,120,60_.svg?w=1280&amp;h=720&amp;hue=190"><img alt="" src="https://art.test/art/fall-p._CLs|600,900|channels-logo|0,0,600,900+500,836,80,40_.svg?w=600&amp;h=900&amp;hue=190"></picture></div></article>
			<article data-testid="top-ten-card" class="topten"><a class="cardlink" href="/detail/smith/" aria-label="Mr. &amp; Mrs. Smith"></a><span class="num">1</span><div class="pic" data-sb-art data-sb-corner="bottom"><img alt="" src="https://art.test/art/smith._CLs|600,900|channels-logo|0,0,600,900+500,836,80,40_.svg?w=600&amp;h=900&amp;hue=350"></div></article>
		</div>
	</section>
</body>
</html>
