name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # also started by accept-visuals.yml after it commits new screenshots (its push starts nothing by itself)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint . --max-warnings=0
      - name: Formatting
        run: npx prettier --check .
      - name: Typecheck
        run: npm run typecheck
      - name: Dependency rules
        run: npx depcruise src --config .dependency-cruiser.cjs
      - name: Test
        run: npx vitest run
      - name: Firefox manifest lint
        run: npm run build:firefox && npm run lint:manifest
