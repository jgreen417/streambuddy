name: Visual checks

# The built extension in headless Chromium on saved copies of Netflix, Prime Video and Max (e2e/visual):
# every badge is checked against the placement spec and screenshotted against e2e/visual/baselines.
# Runs inside Playwright's own image so fonts and rendering match the committed baselines exactly.

on:
  push:
    branches: ["main"]
  pull_request:
    # also started by accept-visuals.yml after it commits new screenshots (its push starts nothing by itself)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Badge placement & screenshots
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      # pages saved from the live sites (e2e/sites), kept private; without the token (a fork) those checks are skipped
      - id: sites
        env:
          TOKEN: ${{ secrets.STREAMBUDDY_SITES_TOKEN }}
          # a pull request's accepted saved-page screenshots wait on a branch of their own in streambuddy-sites until
          # it merges (accept-visuals.yml), so main and other pull requests keep comparing against main's
          BRANCH: streambuddy/${{ github.head_ref || github.ref_name }}
          # a pull request stacked on another's starts from the screenshots that one has accepted
          BASE: ${{ github.base_ref && format('streambuddy/{0}', github.base_ref) || '' }}
        run: |
          echo "token=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          ref=main
          for branch in "$BRANCH" "$BASE"; do
            if [ -n "$TOKEN" ] && [ -n "$branch" ] && git ls-remote --exit-code --heads \
              "https://x-access-token:$TOKEN@github.com/jgreen417/streambuddy-sites.git" "$branch" > /dev/null; then
              ref=$branch
              break
            fi
          done
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.sites.outputs.token == 'true'
        with:
          repository: jgreen417/streambuddy-sites
          ref: ${{ steps.sites.outputs.ref }}
          token: ${{ secrets.STREAMBUDDY_SITES_TOKEN }}
          path: e2e/.sites-fixtures
          persist-credentials: false
      - run: npm ci
      - name: Typecheck the visual tests
        run: npx tsc -p e2e/tsconfig.json
      - name: Run visual checks
        run: npx playwright test --project=fixtures
      # The saved pages show a signed-in account's rows, and this repo's run output is public, so their screenshots and
      # diffs stay out of the uploaded report; the accept-visuals label is how a changed one is accepted.
      - name: Run visual checks on the saved pages
        if: steps.sites.outputs.token == 'true' && (success() || failure())
        env:
          SB_VISUAL_SKIP_BUILD: "1"
        run: npx playwright test --project="saved pages" --reporter=list --output=e2e/.saved-results
      - name: Collect changed screenshots
        if: failure()
        run: |
          mkdir -p e2e/.new-baselines
          find e2e/.results -name '*-actual.*' | while read -r file; do
            cp "$file" "e2e/.new-baselines/$(basename "$file" | sed 's/-actual\././')"
          done
          {
            echo "### Screenshots that changed"
            echo
            echo "Download **visual-report** (open \`index.html\`) to see each one as expected / actual / diff."
            echo "If the new look is right, the files in **visual-new-baselines** replace those in \`e2e/visual/baselines\`."
            echo "A saved page's screenshot isn't uploaded: add the accept-visuals label to accept it."
            echo
            for file in e2e/.new-baselines/*.*; do
              # (with nothing to list, the loop must still end well, or the step fails)
              [ ! -e "$file" ] || echo "- \`${file#e2e/.new-baselines/}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-report
          path: |
            e2e/.report
            e2e/.results
          retention-days: 14
          # the output folders start with a dot, which upload-artifact skips unless told otherwise
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-new-baselines
          path: e2e/.new-baselines
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
