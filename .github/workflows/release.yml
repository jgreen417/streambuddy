name: Release

# Pushing a tag like v1.0.3 builds the release packages, attaches them to a GitHub release and submits them to
# the Chrome Web Store and addons.mozilla.org for review. Both stores still review the version before users get it.
# The tag must match the version in package.json. Store listing text, screenshots and icons are not touched:
# those stay in each store's dashboard. Setup and secrets: store/RELEASING.md.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Check & build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Lint
        run: npx eslint . --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npx vitest run
      - name: Build release packages
        env:
          # streamBuddy's shared TMDb key, built into the store packages so ratings work without setup
          STREAMBUDDY_TMDB_KEY: ${{ secrets.STREAMBUDDY_TMDB_KEY }}
        run: |
          if [ -z "$STREAMBUDDY_TMDB_KEY" ]; then
            echo "::error::Add the STREAMBUDDY_TMDB_KEY secret first, or every new user would have to bring their own key"
            exit 1
          fi
          mkdir -p release
          npm run build:release
          npm run build:release:firefox
          npm run build:source
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            release/chrome-*.zip
            release/firefox-*.zip
            release/firefox/
            release/streambuddy-source.zip
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "streamBuddy ${{ needs.build.outputs.version }}" \
            --generate-notes release/chrome-*.zip release/firefox-*.zip release/streambuddy-source.zip

  chrome:
    name: Submit to Chrome Web Store
    needs: build
    runs-on: ubuntu-latest
    environment: stores
    permissions:
      contents: read
      # lets Google trust this run's GitHub identity token, so no service account key is stored anywhere
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: Sign in to Google as the store's service account
        id: google
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      - name: Upload and submit for review
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: lieihlkbpleoeoaiagnfcegegjgeeojc
        run: npx tsx scripts/publish-chrome.ts "release/chrome-${{ needs.build.outputs.version }}.zip"

  firefox:
    name: Submit to addons.mozilla.org
    needs: build
    runs-on: ubuntu-latest
    environment: stores
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: Write release and reviewer notes
        env:
          AMO_APPROVAL_NOTES: ${{ secrets.AMO_APPROVAL_NOTES }}
          # reviewers rebuild from source, so the notes must carry the key the package was built with
          STREAMBUDDY_TMDB_KEY: ${{ secrets.STREAMBUDDY_TMDB_KEY }}
        run: npx tsx scripts/amo-metadata.ts "$RUNNER_TEMP/amo-metadata.json"
      - name: Upload with source and submit for review
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        # the add-on id comes from the manifest (streambuddy@jgreen417); --approval-timeout 0 returns once
        # the version is queued for review instead of waiting for a reviewer
        run: |
          npx web-ext sign --source-dir release/firefox --artifacts-dir "$RUNNER_TEMP/web-ext" \
            --channel listed --upload-source-code release/streambuddy-source.zip \
            --amo-metadata "$RUNNER_TEMP/amo-metadata.json" --approval-timeout 0
